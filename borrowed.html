<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library Management System - My Borrowed Books</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="borrowed-page">
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-brand">
                <i class="fas fa-book-open"></i>
                <span>PagePilot</span>
            </div>
            <div class="nav-menu">
                <a href="dashboard.html" class="nav-link">
                    <i class="fas fa-home"></i>
                    Dashboard
                </a>
                <a href="books.html" class="nav-link">
                    <i class="fas fa-book"></i>
                    Browse Books
                </a>
                <a href="borrowed.html" class="nav-link active">
                    <i class="fas fa-bookmark"></i>
                    My Books
                </a>
                <a href="profile.html" class="nav-link">
                    <i class="fas fa-user"></i>
                    Profile
                </a>
                <button class="nav-link logout-btn" onclick="logout()">
                    <i class="fas fa-sign-out-alt"></i>
                    Logout
                </button>
            </div>
            <div class="nav-toggle" onclick="toggleMobileNav()">
                <i class="fas fa-bars"></i>
            </div>
        </div>
    </nav>
    
    <div class="main-content">
        <div class="container">
            <div class="page-header">
                <h1>My Borrowed Books</h1>
                <p>Manage your current reading list</p>
            </div>
            
            <div class="borrowed-summary">
                <div class="summary-card">
                    <div class="summary-icon">
                        <i class="fas fa-book"></i>
                    </div>
                    <div class="summary-info">
                        <div class="summary-number" id="totalBorrowed">0</div>
                        <div class="summary-label">Books Borrowed</div>
                    </div>
                </div>
                
                <div class="summary-card">
                    <div class="summary-icon overdue">
                        <i class="fas fa-exclamation-triangle"></i>
                    </div>
                    <div class="summary-info">
                        <div class="summary-number" id="totalOverdue">0</div>
                        <div class="summary-label">Overdue Books</div>
                    </div>
                </div>
                
                <div class="summary-card">
                    <div class="summary-icon due-soon">
                        <i class="fas fa-clock"></i>
                    </div>
                    <div class="summary-info">
                        <div class="summary-number" id="totalDueSoon">0</div>
                        <div class="summary-label">Due Soon</div>
                    </div>
                </div>
            </div>
            
            <div class="borrowed-books-container">
                <div id="borrowedBooksList" class="borrowed-books-list">
                    <!-- Borrowed books will be populated by JavaScript -->
                </div>
                
                <div id="emptyState" class="empty-state">
                    <div class="empty-icon">
                        <i class="fas fa-book-open"></i>
                    </div>
                    <h3>No Books Borrowed</h3>
                    <p>You haven't borrowed any books yet. Start exploring our collection!</p>
                    <a href="books.html" class="btn-primary">Browse Books</a>
                </div>
            </div>
        </div>
    </div>
    
    <script src="data.js"></script>
    <script src="script.js"></script>
</body>
</html>
